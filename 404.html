<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Not Found</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}
body{
    height:100vh;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#333;
}
.container{
    text-align:center;
}
h1{
    font-size:120px;
    font-weight:700;
    color:#222;
    animation:show .8s ease;
}
h2{
    font-size:28px;
    margin-bottom:15px;
}
p{
    color:#777;
    font-size:16px;
    margin-bottom:30px;
}
a{
    text-decoration:none;
    color:white;
    background:#222;
    padding:12px 25px;
    border-radius:8px;
    transition:.3s;
}
a:hover{
    background:#555;
}
@keyframes show{
    from{
        opacity:0;
        transform:translateY(-30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>Xin lỗi, trang bạn đang tìm kiếm không tồn tại.</p>
    <a href="/">Về trang chủ</a>
</div>

</body>
</html>
